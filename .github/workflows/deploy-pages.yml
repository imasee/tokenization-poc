name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Configure Azure Artifacts auth for @triparc packages
        run: |
          B64_PAT=$(printf '%s' "${{ secrets.AZURE_ARTIFACTS_PAT }}" | base64 -w0)
          echo "//pkgs.dev.azure.com/trip-arc/_packaging/trip-arc/npm/registry/:username=trip-arc" >> .npmrc
          echo "//pkgs.dev.azure.com/trip-arc/_packaging/trip-arc/npm/registry/:_password=$B64_PAT" >> .npmrc
          echo "//pkgs.dev.azure.com/trip-arc/_packaging/trip-arc/npm/registry/:email=noreply@example.com" >> .npmrc

      - run: npm ci

      - run: npx ng build --configuration production --base-href /tokenization-poc/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/tokenization-poc/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
